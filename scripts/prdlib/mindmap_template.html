<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--ink:#16202E;--ink2:#3F4C5E;--ink3:#748094;--line:#D3D9E1;--tool:rgba(255,255,255,.92);
  --amber:#B45309;--amberbg:#FDF0CD;--blue:#1D4ED8;--bluebg:#DCE8FF}
@media (prefers-color-scheme:dark){:root{--bg:#11151B;--card:#1B212A;--ink:#E7EBF1;--ink2:#BAC4D1;--ink3:#8793A5;--line:#343D4A;--tool:rgba(27,33,42,.92);
  --amber:#FBBF24;--amberbg:#3B2D0C;--blue:#93B4FF;--bluebg:#1B2B52}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
svg{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
svg.drag{cursor:grabbing}
.bar{position:fixed;left:16px;right:16px;top:14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.box{background:var(--tool);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ttl{padding:7px 14px;font-weight:600;font-size:15px}
.ttl small{font-weight:400;color:var(--ink3);margin-left:10px;font-size:12px}
.btns{display:flex;padding:3px;gap:2px}
button{font:inherit;font-size:13px;color:var(--ink2);background:none;border:0;border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--line);color:var(--ink)}
.legend{position:fixed;right:16px;bottom:14px;padding:8px 12px;font-size:12px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.legend i{display:inline-block;width:18px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink3)}
.legend i.d{border-style:dashed}
.legend i.p{border:0;border-bottom:1.5px solid var(--ink3);border-radius:0;height:8px}
.info{position:fixed;left:16px;bottom:14px;width:min(380px,calc(100% - 32px));padding:14px 16px;display:none;font-size:13px;color:var(--ink2)}
.info h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
.info .kind{font-size:12px;color:var(--ink3);margin-bottom:8px}
.info p{margin:6px 0 0}
.info b{color:var(--ink);font-weight:600}
.info .x{position:absolute;right:6px;top:6px;padding:2px 8px;font-size:16px;line-height:1.2}
.node{cursor:pointer}
.node text{pointer-events:none}
.tg{cursor:pointer}
@media (max-width:640px){.legend{display:none}.ttl small{display:none}}
@media print{.bar,.legend,.info{display:none!important}}
</style>
</head>
<body>
<svg id="svg" role="img" aria-label="页面结构思维导图"><g id="view"></g></svg>
<div class="bar">
  <div class="box ttl"><span id="ttl"></span><small id="cnt"></small></div>
  <div class="box btns">
    <button data-act="all">全部展开</button>
    <button data-act="pages">只看页面</button>
    <button data-act="comps">只看页面和组件</button>
  </div>
  <div class="box btns">
    <button data-act="fit">适应窗口</button>
    <button data-act="out" aria-label="缩小">－</button>
    <button data-act="in" aria-label="放大">＋</button>
  </div>
</div>
<div class="box info" id="info"><button class="x" data-act="close" aria-label="关闭">×</button><h3 id="i-t"></h3><div class="kind" id="i-k"></div><div id="i-b"></div></div>
<div class="box legend"><span><i></i>本页组件</span><span><i class="d"></i>复用或全局组件</span><span><i class="p"></i>组件的组成部分</span><span>点节点右侧的圆点收起或展开，点组件看它的目的</span></div>
<script>
(function(){
var DATA = __DATA__;
var NS = 'http://www.w3.org/2000/svg';
var FAMILY = '-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
var FONT = {root:'600 18px', tab:'600 15px', page:'600 15px', comp:'500 14px', reuse:'500 14px', global:'500 14px', group:'600 14px', part:'400 13px'};
var HT = {root:46, tab:36, page:36, comp:32, reuse:32, global:32, group:30, part:26};
var PAD = {root:20, tab:16, page:14, comp:12, reuse:12, global:12, group:3, part:3};
var PALETTE = ['#2F6FDE','#0E9F6E','#D9731A','#8B5CF6','#D6336C','#0891B2'];
var GAPX = 48, GAPY = 8, GAPPAGE = 20;
var svg = document.getElementById('svg'), view = document.getElementById('view');
var ctx = document.createElement('canvas').getContext('2d');
var tf = {x: 40, y: 40, k: 1}, cursor = 0, selected = null;

function isComp(n){ return n.k === 'comp' || n.k === 'reuse' || n.k === 'global'; }
function tw(text, font){ ctx.font = font + ' ' + FAMILY; return ctx.measureText(text).width; }

function prep(n, parent, depth, col){
  n.parent = parent; n.depth = depth; n.open = true; n.c = n.c || []; n.col = col;
  n.badges = [];
  if (n.k === 'comp') n.badges.push({t: n.n, c: 'num'});
  if (n.k === 'reuse') n.badges.push({t: '复用 ' + n.n, c: 'num'});
  if (n.k === 'global') n.badges.push({t: '全局 ' + n.n, c: 'num'});
  if (n.q) n.badges.push({t: '待定', c: 'todo'});
  if (n.s) n.badges.push({t: '建议', c: 'sugg'});
  n.tw = tw(n.t, FONT[n.k]);
  n.pw = (n.k === 'page' && n.n) ? tw(n.n, '500 12px') + 8 : 0;
  var w = PAD[n.k] * 2 + n.pw + n.tw;
  n.badges.forEach(function(b){ b.w = Math.ceil(tw(b.t, '500 11px')) + 12; w += b.w + 6; });
  n.w = Math.ceil(w); n.h = HT[n.k];
  n.c.forEach(function(c, i){
    var cc = depth === 0 ? (c.n === '3.0' ? '#64748B' : PALETTE[(i - (DATA.c[0] && DATA.c[0].n === '3.0' ? 1 : 0) + PALETTE.length) % PALETTE.length]) : col;
    prep(c, n, depth + 1, cc);
  });
  n.hc = n.c.some(function(c){ return isComp(c) || c.hc; });
}

function shift(n, dy){ n.y += dy; if (n.open) n.c.forEach(function(c){ shift(c, dy); }); }

function layout(n, x){
  n.x = x;
  var kids = n.open ? n.c : [], top = cursor;
  if (!kids.length){ n.y = cursor + n.h / 2; cursor += n.h + GAPY; }
  else {
    kids.forEach(function(k){ layout(k, x + n.w + GAPX); if (n.depth === 0) cursor += GAPPAGE; });
    n.y = (kids[0].y + kids[kids.length - 1].y) / 2;
    var over = top - (n.y - n.h / 2);
    if (over > 0){ shift(n, over); cursor += over; }
    cursor = Math.max(cursor, n.y + n.h / 2 + GAPY);
  }
}

function el(name, attrs, parent, text){
  var e = document.createElementNS(NS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

function visible(n, out){ out.push(n); if (n.open) n.c.forEach(function(c){ visible(c, out); }); return out; }

function draw(){
  cursor = 0; layout(DATA, 0);
  while (view.firstChild) view.removeChild(view.firstChild);
  var links = el('g', {fill: 'none', 'stroke-width': 1.5}, view), nodes = el('g', {}, view);
  visible(DATA, []).forEach(function(n){
    if (n.parent){
      var p = n.parent, x1 = p.x + p.w + (p.c.length ? 19 : 0), y1 = p.y,
          x2 = n.x, y2 = n.k === 'part' ? n.y + n.h / 2 - 3 : n.y, mx = (x1 + x2) / 2;
      el('path', {d: 'M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2, stroke: n.col, 'stroke-opacity': .55}, links);
    }
    var g = el('g', {class: 'node', transform: 'translate(' + n.x + ',' + (n.y - n.h / 2) + ')'}, nodes);
    var boxed = n.k !== 'part' && n.k !== 'group', fill = 'var(--card)', ink = 'var(--ink)';
    // 页面在第一层时填色；页面归在某个入口（标签）下面时，入口填色，页面用描边
    var solid = n.k === 'tab' || (n.k === 'page' && n.depth === 1), preInk = '#fff';
    if (n.k === 'root'){ fill = 'var(--ink)'; ink = 'var(--bg)'; }
    if (solid){ fill = n.col; ink = '#fff'; }
    if (n.k === 'page' && !solid) preInk = n.col;
    if (n.k === 'part') ink = 'var(--ink2)';
    if (boxed){
      var r = el('rect', {width: n.w, height: n.h, rx: n.k === 'root' ? 11 : 8, fill: fill}, g);
      if (n.k === 'page' && !solid){ r.setAttribute('stroke', n.col); r.setAttribute('stroke-width', selected === n ? 3 : 2); }
      if (isComp(n)){ r.setAttribute('stroke', n.col); r.setAttribute('stroke-width', selected === n ? 2.5 : 1.5); if (n.k !== 'comp') r.setAttribute('stroke-dasharray', '5 4'); }
    } else {
      el('rect', {width: n.w, height: n.h, fill: 'transparent'}, g);
      el('path', {d: 'M0 ' + (n.h - 3) + 'H' + n.w, stroke: n.col, 'stroke-width': 1.5, 'stroke-opacity': .55}, g);
    }
    var x = PAD[n.k], fp = FONT[n.k].split(' ');
    if (n.pw){ el('text', {x: x, y: n.h / 2, 'dominant-baseline': 'central', fill: preInk, 'fill-opacity': .78, 'font-size': 12, 'font-weight': 500}, g, n.n); x += n.pw; }
    el('text', {x: x, y: n.h / 2 - (n.k === 'part' ? 1 : 0), 'dominant-baseline': 'central', fill: ink, 'font-size': parseInt(fp[1]), 'font-weight': fp[0]}, g, n.t);
    x += n.tw + 6;
    n.badges.forEach(function(b){
      var bg = b.c === 'todo' ? 'var(--amberbg)' : b.c === 'sugg' ? 'var(--bluebg)' : n.col,
          fg = b.c === 'todo' ? 'var(--amber)' : b.c === 'sugg' ? 'var(--blue)' : n.col,
          br = el('rect', {x: x, y: (n.h - 18) / 2, width: b.w, height: 18, rx: 9, fill: bg}, g);
      if (b.c === 'num') br.setAttribute('fill-opacity', .14);
      el('text', {x: x + b.w / 2, y: n.h / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: fg, 'font-size': 11, 'font-weight': 500}, g, b.t);
      x += b.w + 6;
    });
    g.addEventListener('click', function(ev){ ev.stopPropagation(); select(n); });
    if (n.c.length){
      var t = el('g', {class: 'tg', transform: 'translate(' + (n.x + n.w + 10) + ',' + n.y + ')'}, nodes);
      el('circle', {r: 8.5, fill: n.open ? 'var(--bg)' : n.col, stroke: n.col, 'stroke-width': 1.5}, t);
      el('text', {'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': n.open ? 13 : 10, 'font-weight': 600, fill: n.open ? n.col : '#fff', y: n.open ? -1 : 0}, t, n.open ? '−' : String(n.c.length));
      t.addEventListener('click', function(ev){ ev.stopPropagation(); toggle(n); });
    }
  });
  apply();
}

function apply(){ view.setAttribute('transform', 'translate(' + tf.x + ',' + tf.y + ') scale(' + tf.k + ')'); }

function toggle(n){
  var ox = n.x, oy = n.y; n.open = !n.open; draw();
  tf.x += (ox - n.x) * tf.k; tf.y += (oy - n.y) * tf.k; apply();
}

function fit(){
  var vs = visible(DATA, []), x1 = 0, y0 = 1e9, y1 = -1e9;
  vs.forEach(function(n){ x1 = Math.max(x1, n.x + n.w + (n.c.length ? 22 : 0)); y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2); });
  var W = window.innerWidth, H = window.innerHeight, side = 28, bot = 56,
      top = document.querySelector('.bar').getBoundingClientRect().bottom + 16;
  tf.k = Math.max(.15, Math.min(1, (W - side * 2) / x1, (H - top - bot) / (y1 - y0)));
  tf.x = Math.max(side, (W - x1 * tf.k) / 2);
  tf.y = top + Math.max(0, (H - top - bot - (y1 - y0) * tf.k) / 2) - y0 * tf.k;
  apply();
}

function zoom(f, cx, cy){
  var k = Math.max(.15, Math.min(2.5, tf.k * f));
  cx = cx == null ? window.innerWidth / 2 : cx; cy = cy == null ? window.innerHeight / 2 : cy;
  tf.x = cx - (cx - tf.x) * k / tf.k; tf.y = cy - (cy - tf.y) * k / tf.k; tf.k = k; apply();
}

function setOpen(fn){ (function walk(n){ n.open = fn(n); n.c.forEach(walk); })(DATA); draw(); fit(); }

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

function select(n){
  var info = document.getElementById('info');
  selected = (isComp(n) || n.k === 'page') ? n : null;
  if (!selected){ info.style.display = 'none'; draw(); return; }
  document.getElementById('i-t').textContent = (n.n ? n.n + ' ' : '') + n.t;
  document.getElementById('i-k').textContent = {comp: '本页组件', reuse: '复用组件：说明在 ' + n.n, global: '全局组件：说明在 ' + n.n, page: n.n === '3.0' ? '多个页面共用的组件' : '页面'}[n.k];
  var h = '';
  if (n.d) h += '<p><b>' + (n.k === 'page' ? '说明' : '目的') + '</b>　' + esc(n.d) + '</p>';
  if (n.st && n.st.length) h += '<p><b>状态（' + n.st.length + '）</b>　' + esc(n.st.join('、')) + '</p>';
  if (n.cf) h += '<p><b>后台配置项</b>　' + n.cf + ' 项</p>';
  if (!h) h = '<p>PRD 里还没有写这一项的说明。</p>';
  document.getElementById('i-b').innerHTML = h;
  info.style.display = 'block'; draw();
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('button[data-act]');
  if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'all') setOpen(function(){ return true; });
  if (a === 'pages') setOpen(function(n){ return n.k === 'root' || n.k === 'tab'; });
  if (a === 'comps') setOpen(function(n){ return !isComp(n) || n.hc; });
  if (a === 'fit') fit();
  if (a === 'in') zoom(1.2);
  if (a === 'out') zoom(1 / 1.2);
  if (a === 'close'){ selected = null; document.getElementById('info').style.display = 'none'; draw(); }
});

var drag = null;
svg.addEventListener('pointerdown', function(ev){ if (ev.target.closest('.node,.tg')) return; drag = {x: ev.clientX - tf.x, y: ev.clientY - tf.y}; svg.classList.add('drag'); svg.setPointerCapture(ev.pointerId); });
svg.addEventListener('pointermove', function(ev){ if (!drag) return; tf.x = ev.clientX - drag.x; tf.y = ev.clientY - drag.y; apply(); });
svg.addEventListener('pointerup', function(){ drag = null; svg.classList.remove('drag'); });
svg.addEventListener('pointercancel', function(){ drag = null; svg.classList.remove('drag'); });
svg.addEventListener('wheel', function(ev){ ev.preventDefault(); zoom(ev.deltaY < 0 ? 1.1 : 1 / 1.1, ev.clientX, ev.clientY); }, {passive: false});
window.addEventListener('resize', fit);

prep(DATA, null, 0, 'var(--ink)');
var pages = 0, comps = 0;
(function count(n){ if (n.k === 'comp') comps++; if (n.k === 'page' && n.n !== '3.0') pages++; n.c.forEach(count); })(DATA);
document.getElementById('ttl').textContent = DATA.t + ' · 页面结构';
document.getElementById('cnt').textContent = pages + ' 个页面，' + comps + ' 个组件';
draw(); fit();
// 全部展开后字太小，就先只展开到组件这一层；还是太小，就只展开到页面，要看哪一页再点开
if (tf.k < 0.7) setOpen(function(n){ return !isComp(n) || n.hc; });
if (tf.k < 0.6) setOpen(function(n){ return n.k === 'root' || n.k === 'tab'; });
})();
</script>
</body>
</html>
